<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon — SSM AI Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .coming-soon-container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .coming-soon-container h1 {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            color: var(--primary-cyan);
            text-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .coming-soon-container p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .coming-soon-icon {
            font-size: 4rem;
            color: var(--primary-magenta);
            margin-bottom: 1.5rem;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid var(--primary-cyan);
            color: var(--primary-cyan);
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .back-link:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        [data-theme="light"] .coming-soon-container h1 {
            color: var(--primary-cyan);
            text-shadow: 0 0 10px rgba(26, 54, 93, 0.3);
        }

        [data-theme="light"] .coming-soon-container p {
            color: var(--text-secondary);
        }

        [data-theme="light"] .back-link {
            background: rgba(26, 54, 93, 0.1);
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        [data-theme="light"] .back-link:hover {
            background: rgba(26, 54, 93, 0.2);
            box-shadow: 0 0 15px rgba(43, 108, 176, 0.4);
        }
    </style>
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">
        <i class="fas fa-sun" id="theme-icon"></i>
    </button>

    <!-- Coming Soon Content -->
    <div class="coming-soon-container">
        <div class="coming-soon-icon">
            <i class="fas fa-rocket"></i>
        </div>
        <h1>Coming Soon</h1>
        <p>This service is currently under development. I'm working hard to bring you something amazing. Check back soon!</p>
        <a href="../index.html#services" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Services
        </a>
    </div>

    <script src="../script.js"></script>
</body>
</html>
